<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unban Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Inter", Arial, sans-serif;
        background: linear-gradient(135deg, #0a0c10, #13171f);
        color: #e5e7eb;
    }

    .card {
        backdrop-filter: blur(14px);
        background: rgba(22, 26, 34, 0.75);
        padding: 40px 60px;
        border-radius: 24px;
        text-align: center;
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
        animation: fadeIn 1s ease forwards;
        max-width: 420px;
        width: 90%;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
        font-size: 2rem;
        margin: 0 0 20px;
        color: #fff;
    }

    .avatar {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 20px;
        border: 3px solid rgba(255, 255, 255, 0.15);
        box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    }

    .timer {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-bottom: 20px;
    }

    .unit { text-align: center; }

    .number {
        font-size: 2.8rem;
        font-weight: 700;
        color: #f8f9fb;
        line-height: 1;
    }

    .label {
        font-size: 0.8rem;
        opacity: 0.75;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #9da3ae;
    }

    .profile-info {
        margin-top: 14px;
        font-size: 0.95rem;
        line-height: 1.4;
        color: #c7cbd3;
    }

    b { color: #fff; }

    @media (max-width: 500px) {
        .number { font-size: 2.2rem; }
        .card { padding: 30px; }
    }
</style>
</head>
<body>

<div class="card">

    <img class="avatar" 
         src="https://tr.rbxcdn.com/30DAY-Avatar-F48563E7C7647AA8B186234722B5340E-Png/720/720/Avatar/Png/noFilter" 
         alt="Avatar">

    <h1>Unban Countdown</h1>

    <div class="timer">
        <div class="unit"><div class="number" id="days">0</div><div class="label">Days</div></div>
        <div class="unit"><div class="number" id="hours">0</div><div class="label">Hours</div></div>
        <div class="unit"><div class="number" id="minutes">0</div><div class="label">Minutes</div></div>
        <div class="unit"><div class="number" id="seconds">0</div><div class="label">Seconds</div></div>
    </div>

    <div class="profile-info">
        <p><b>Roblox User:</b> sacredmatrimony</p>
        <p><b>User ID:</b> 1341403467</p>
        <p>This countdown marks when this account becomes unbanned.</p>
    </div>
</div>

<script>
// 5 hours and 26 minutes in milliseconds
const offset = (5 * 60 + 26) * 60 * 1000;

// Set target time when the page loads
const target = Date.now() + offset;

function update() {
    const now = Date.now();
    const diff = target - now;

    if (diff <= 0) {
        document.querySelector(".card").innerHTML =
            "<h1>Account Unbanned 🎉</h1>";
        return;
    }

    // Time math
    const days    = Math.floor(diff / 86400000);
    const hours   = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);

    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

setInterval(update, 1000);
update();
</script>

</body>
</html>
